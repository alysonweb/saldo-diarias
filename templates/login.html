<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0d1b2e">
  <title>Login — MDS/DITRAN</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
      background: linear-gradient(135deg, #0d1b2e 0%, #1e3a5f 50%, #2563eb 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      position: relative;
      overflow: hidden;
    }
    body::before {
      content: '';
      position: absolute;
      top: -100px; right: -100px;
      width: 400px; height: 400px;
      background: rgba(255,255,255,.04);
      border-radius: 50%;
    }
    body::after {
      content: '';
      position: absolute;
      bottom: -120px; left: -80px;
      width: 300px; height: 300px;
      background: rgba(255,255,255,.03);
      border-radius: 50%;
    }
    .login-card {
      background: rgba(255,255,255,.97);
      backdrop-filter: blur(20px);
      border-radius: 20px;
      padding: 48px 44px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 24px 80px rgba(0,0,0,.35);
      position: relative;
      z-index: 1;
    }
    .login-logo {
      width: 64px; height: 64px;
      background: linear-gradient(135deg, #2563eb, #60a5fa);
      border-radius: 18px;
      display: flex; align-items: center; justify-content: center;
      color: #fff; font-size: 28px;
      margin: 0 auto 20px;
      box-shadow: 0 8px 24px rgba(37,99,235,.4);
    }
    .login-title {
      text-align: center;
      font-size: 22px;
      font-weight: 800;
      color: #0f172a;
      margin-bottom: 4px;
    }
    .login-sub {
      text-align: center;
      font-size: 12.5px;
      color: #64748b;
      margin-bottom: 32px;
      line-height: 1.5;
    }
    .form-label {
      font-size: 12.5px;
      font-weight: 600;
      color: #475569;
      margin-bottom: 6px;
      display: block;
    }
    .form-control {
      width: 100%;
      border: 1.5px solid #e2e8f0;
      border-radius: 10px;
      padding: 11px 14px;
      font-size: 14px;
      font-family: inherit;
      transition: border .2s, box-shadow .2s;
      outline: none;
      background: #fff;
      color: #0f172a;
    }
    .form-control:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37,99,235,.12);
    }
    .input-group-icon {
      position: relative;
    }
    .input-group-icon .icon {
      position: absolute;
      left: 13px; top: 50%;
      transform: translateY(-50%);
      color: #94a3b8;
      font-size: 14px;
    }
    .input-group-icon .form-control { padding-left: 38px; }
    .btn-login {
      width: 100%;
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 13px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: opacity .2s, transform .2s;
      font-family: inherit;
      margin-top: 8px;
    }
    .btn-login:hover { opacity: .92; transform: translateY(-1px); }
    .btn-login:active { transform: translateY(0); }
    .forgot-link {
      display: block;
      text-align: center;
      margin-top: 16px;
      font-size: 12.5px;
      color: #64748b;
      text-decoration: none;
      transition: color .2s;
    }
    .forgot-link:hover { color: #2563eb; }
    .alert {
      border-radius: 10px;
      font-size: 13px;
      padding: 10px 14px;
      margin-bottom: 20px;
      border: none;
    }
    .alert-danger  { background: #fef2f2; color: #991b1b; }
    .alert-warning { background: #fffbeb; color: #92400e; }
    .alert-success { background: #f0fdf4; color: #14532d; }
    .alert-info    { background: #eff6ff; color: #1e40af; }
    .divider {
      border: none;
      border-top: 1px solid #e2e8f0;
      margin: 28px 0 20px;
    }
    .footer-text {
      text-align: center;
      font-size: 11px;
      color: #94a3b8;
    }
    @media (max-width: 480px) {
      .login-card { padding: 32px 24px; }
    }
  </style>
</head>
<body>

<div class="login-card">
  <div class="login-logo">
    <i class="fas fa-car-side"></i>
  </div>
  <div class="login-title">DITRAN / MDS</div>
  <div class="login-sub">
    Sistema de Controle de Diárias<br>Ministério do Desenvolvimento Social
  </div>

  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for cat, msg in messages %}
      <div class="alert alert-{{ cat }}">
        <i class="fas fa-{{ 'check-circle' if cat == 'success' else ('exclamation-triangle' if cat == 'warning' else ('info-circle' if cat == 'info' else 'times-circle')) }} me-2"></i>
        {{ msg|safe }}
      </div>
    {% endfor %}
  {% endwith %}

  <form method="post" action="{{ url_for('login_page') }}">
    <div class="mb-4">
      <label class="form-label" for="matricula">Matrícula</label>
      <div class="input-group-icon">
        <span class="icon"><i class="fas fa-id-card"></i></span>
        <input type="text" id="matricula" name="matricula" class="form-control"
               placeholder="Digite sua matrícula" required autocomplete="username"
               value="{{ request.form.get('matricula', '') }}">
      </div>
    </div>
    <div class="mb-4">
      <label class="form-label" for="senha">Senha</label>
      <div class="input-group-icon">
        <span class="icon"><i class="fas fa-lock"></i></span>
        <input type="password" id="senha" name="senha" class="form-control"
               placeholder="Digite sua senha" required autocomplete="current-password">
      </div>
    </div>
    <button type="submit" class="btn-login">
      <i class="fas fa-right-to-bracket me-2"></i> Entrar
    </button>
  </form>

  <a href="#" class="forgot-link" onclick="alert('Entre em contato com o administrador do sistema.')">
    <i class="fas fa-question-circle me-1"></i> Esqueceu a senha?
  </a>

  <hr class="divider">
  <div class="footer-text">
    <i class="fas fa-shield-halved me-1"></i> Acesso restrito a servidores autorizados
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
